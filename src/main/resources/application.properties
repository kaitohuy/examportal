spring.application.name=examserver

server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- T?i ?u kh?i ??ng ---
spring.main.lazy-initialization=true
spring.jmx.enabled=false
spring.main.banner-mode=off

# --- Tomcat ---
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50

# --- Logging ---
logging.level.root=WARN
logging.level.com.exam=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN

# --- JWT ---
jwt.secret=${JWT_SECRET}

# --- GCS ---
gcs.bucket=${GCS_BUCKET:}
gcs.signed-url-ttl-min=${GCS_SIGNED_TTL_MIN:5}

# --- MAIL ---
spring.mail.host=${HOST_MAIL:}
spring.mail.port=${PORT_MAIL:}
spring.mail.username=${USER_MAIL:}
spring.mail.password=${PASS_MAIL:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
app.mail.from=ExamPortal <no-reply@examportal.local>
app.frontend-url=http://localhost:4200

# --- AI Suggestion ---
ai.provider=${AI_PROVIDER:openai}
ai.openai.apiBase=${OPENAI_API_BASE:https://openrouter.ai/api}
ai.openai.apiKey=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:openai/gpt-4o-mini}
ai.openai.timeoutMs=${OPENAI_TIMEOUT_MS:15000}
ai.cacheTtlSeconds=${AI_CACHE_TTL_SECONDS:86400}
ai.maxRequestsPerUserPerHour=${AI_MAX_RPH:60}